services:
  db:
    image: postgis/postgis:16-3.4
    container_name: munrostream-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-munrostream}
      POSTGRES_USER: ${POSTGRES_USER:-munro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-munro}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-munro} -d ${POSTGRES_DB:-munrostream}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    container_name: munrostream-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  munro-seed:
    build:
      context: ./backend
    container_name: munrostream-seed
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://munro:munro@db:5432/munrostream}
    command: ["python", "scripts/seed_munros.py", "--skip-if-seeded"]
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ./backend
    container_name: munrostream-api
    environment:
      APP_NAME: MunroStream API
      API_V1_PREFIX: /api/v1
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://munro:munro@db:5432/munrostream}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      STRAVA_CLIENT_ID: ${STRAVA_CLIENT_ID:-0}
      STRAVA_CLIENT_SECRET: ${STRAVA_CLIENT_SECRET:-replace-me}
      STRAVA_REDIRECT_URI: ${STRAVA_REDIRECT_URI:-http://localhost:18000/api/v1/strava/oauth/callback}
      STRAVA_OAUTH_STATE_TTL_SECONDS: ${STRAVA_OAUTH_STATE_TTL_SECONDS:-600}
      STRAVA_SYNC_ACTIVITY_LIMIT: ${STRAVA_SYNC_ACTIVITY_LIMIT:-25}
      STRAVA_WEBHOOK_SECRET: ${STRAVA_WEBHOOK_SECRET:-replace-me}
      STRAVA_WEBHOOK_VERIFY_TOKEN: ${STRAVA_WEBHOOK_VERIFY_TOKEN:-replace-me}
      FRONTEND_ORIGIN: http://localhost:${FRONTEND_PORT:-5173}
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "18000", "--reload"]
    volumes:
      - ./backend:/app
    ports:
      - "${API_PORT:-18000}:18000"
    depends_on:
      db:
        condition: service_healthy
      munro-seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    container_name: munrostream-worker
    environment:
      APP_NAME: MunroStream Worker
      API_V1_PREFIX: /api/v1
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://munro:munro@db:5432/munrostream}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      STRAVA_CLIENT_ID: ${STRAVA_CLIENT_ID:-0}
      STRAVA_CLIENT_SECRET: ${STRAVA_CLIENT_SECRET:-replace-me}
      STRAVA_REDIRECT_URI: ${STRAVA_REDIRECT_URI:-http://localhost:18000/api/v1/strava/oauth/callback}
      STRAVA_OAUTH_STATE_TTL_SECONDS: ${STRAVA_OAUTH_STATE_TTL_SECONDS:-600}
      STRAVA_SYNC_ACTIVITY_LIMIT: ${STRAVA_SYNC_ACTIVITY_LIMIT:-25}
      STRAVA_WEBHOOK_SECRET: ${STRAVA_WEBHOOK_SECRET:-replace-me}
      STRAVA_WEBHOOK_VERIFY_TOKEN: ${STRAVA_WEBHOOK_VERIFY_TOKEN:-replace-me}
      FRONTEND_ORIGIN: http://localhost:${FRONTEND_PORT:-5173}
    command:
      [
        "celery",
        "-A",
        "app.worker.celery_app:celery_app",
        "worker",
        "--loglevel=INFO",
      ]
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      munro-seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: munrostream-frontend
    environment:
      VITE_API_PROXY_TARGET: http://api:18000
      VITE_API_BASE_URL: /api/v1
      VITE_OS_MAPS_API_KEY: ${VITE_OS_MAPS_API_KEY:-}
      VITE_OS_MAPS_TILE_URL_TEMPLATE: ${VITE_OS_MAPS_TILE_URL_TEMPLATE:-https://api.os.uk/maps/raster/v1/zxy/Outdoor_3857/{z}/{x}/{y}.png?key={key}}
      VITE_OS_MAPS_ATTRIBUTION: ${VITE_OS_MAPS_ATTRIBUTION:-Contains OS data &copy; Crown copyright and database rights}
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
  frontend_node_modules:
